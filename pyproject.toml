[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhtsa-metadata-side-loadcell"
version = "0.1.0"
description = "NHTSA side-pole load-cell metadata and analysis-readiness workspace."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = [
  ".harness/tests",
]
pythonpath = [
  ".harness/scripts",
  "scripts",
]
